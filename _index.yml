indexpage:
  title: Documentação do ONTAP Mediator
  summary: O ONTAP Mediator oferece suporte aos recursos do ONTAP, fornecendo um armazenamento
    persistente e isolado para metadados de alta disponibilidade (HA), funcionalidade
    de consulta síncrona da integridade do nó para auxiliar na determinação do quorum
    e atuando como um proxy de ping para a capacidade de resposta do controlador.
  keywords: mediator, ONTAP, high-availability, HA, metadata, quorum, controller,
    liveliness, smbc, metrocluster, snapmirrror active sync
  lead: O ONTAP Mediator oferece suporte ao SnapMirror active sync e ao MetroCluster
    IP, fornecendo um armazenamento persistente e isolado para metadados de alta disponibilidade
    (HA), funcionalidade de consulta síncrona da integridade do nó para ajudar na
    determinação de quórum e atuando como um proxy de ping para a operacionalidade
    do controlador.
